<html>
<head>
    <title>0601-作品</title>
    <style>
        @keyframes bg_move{
            0%{background-position-y: 0px;}
            100%{background-position-y: 216px;}
        } 
        #uni{
            width: 600px;
            height: 600px;
            background: url("pic/bg_stars.jpg");
            animation: bg_move 1s linear infinite;
            position: relative;
        }
        #ship{
            width: 60px;
            height: 90px;
            position: absolute;
            top: 500px;
            left: 270px;
        }
        #ufo{
            width: 360px;
            height: 240px;
            position: absolute;
            left: 120px;
        }
        .bullet{
            width: 10px;
            height: 10px;
            background: white;
            position: absolute;
        }
    </style>
    <script>
        function getRand(min,max) {
            return Math.floor(Math.random() * (max-min+1))+min;
        }
        function showPos(obj) {
            obj.style.top=obj.pos.y + "px";
            obj.style.left=obj.pos.x + "px";
        }
        function ship_move(){
            if(ship.way["ArrowUp"] && ship.pos.y>0)ship.pos.y--;
            else if(ship.way["ArrowDown"] && ship.pos.y<510)ship.pos.y++;
            else if(ship.way["ArrowLeft"] && ship.pos.x>0)ship.pos.x--;
            else if(ship.way["ArrowRight"] && ship.pos.x<540)ship.pos.x++;
            showPos(ship);
        }
        function ufo_move(){
            
            ufo.pos.x+=getRand(-120,120);
            showPos(ufo);
        }
        
        function bullet_move(b){
            if(b.pos.y<0){
                clearInterval(b.move);
                b.remove();
            }else{
                b.pos.y--;
                showPos(b);
                var hit=Array.from(document.getElementsByClassName("ufo")).filter((u)=>{
                    return (u.pos.x < b.pos.x) && (u.pos.x + 180 > b.pos.x + 10) && (u.pos.y +120 >= b.pos.y);
                });
                if(hit.length>0){
                    b.remove;
                   ufo_HP-=2;

                }
            }
        }
        function shoot() {
            var b=document.createElement("div");
            b.className="bullet";
            b.pos={x:ship.pos.x+30, y:ship.pos.y-30};
            b.move=setInterval(bullet_move,3,b);
            document.getElementById("universe").appendChild(b);
        }
        function game_start(){
            if(gameing) return;
            gameing=true;
            ufo_move();
            ufo_HP=200;
            ship_HP=100;
        }
        function game_init() {
            ufo=document.getElementById("ufo");
            ship=document.getElementById("ship");
            ship.pos={x:270,y:500};
            ship.way={"ArrowLeft":0,"ArrowRight":0,"ArrowUp":0,"ArrowDown":0,};
            ship.move=setInterval(ship_move,5);
            gameing=false;
        }
        function mykeydown() {
            event.preventDefault();
            if(Object.keys(ship.way).includes(event.key)) {
                ship.way[event.key]=1;
            }else if(event.key==" "){
                shoot();
            }
        }
        function mykeyup() {
            event.preventDefault();
            if(Object.keys(ship.way).includes(event.key)) {
                ship.way[event.key]=0;
        }
        }
    </script>
</head>
<body onload="game_init()" onkeydown="mykeydown()" onkeyup="mykeyup()">
    <div>HP<span id="ufo_HP"></span></div>
    <div id="uni" onclick="game_start()">
        <img id="ship" src="pic/ship.png">
        <img id="ufo" src="pic/ufo.png">
    </div>
    <div>HP</div>
</body>    
</html>
