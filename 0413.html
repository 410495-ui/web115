<html>
,<head>
    <title>0413-漸變,字形,陰影</title>
    <style>
        div{
            margin-bottom: 60px;
        }
        #d1{
            width: 100px;
            height: 50px;
            background-color: red;
            transition: width 0.5s,height 0.5s,border 0.5s;
            border: 3px solid purple;
        }
        #d1:hover{
            width: 150px;
            height: 90px;
            border: 3px solid blue;
        }
        #d2{
            width: 200px;
            height: 200px;
            background-color: blue;
            box-shadow: black 0px 0px 5px 5px;
        }
        #d3{
            font-size: 4em;
            color: white;
            text-shadow: black 0px 0px 10px;
        }
        #d4{
            font-size: 30pt;
            font-family:'Times New Roman','標楷體' Times, serif; 
            font-weight: 500;
        }
        #d5{
            font-size: 30pt;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3">文字</div>
    <div id="d4">襯線體</div>
    <div id="d5">無襯線體</div>

</body>    
</html>
