<html>
<head>
    <title>0323-CSS動畫</title>
    <style>
        div{
            margin-bottom: 10px;
            width: 400px;
            height: 100px;
        }
        @keyframes kd1 {
            0%{background: linear-gradient(0deg,red,blue); }
            8%{background: linear-gradient(30deg,red,blue); }
            17%{background: linear-gradient(60deg,red,blue); }
            25%{background: linear-gradient(90deg,red,blue);}
            33%{background: linear-gradient(120deg,red,blue); }
            42%{background: linear-gradient(150deg,red,blue); }
            50%{background: linear-gradient(180deg,red,blue); }
            58%{background: linear-gradient(210deg,red,blue); }
            67%{background: linear-gradient(240deg,red,blue); }
            75%{background: linear-gradient(270deg,red,blue); }
            83%{background: linear-gradient(300deg,red,blue); }
            92%{background: linear-gradient(330deg,red,blue); }
            100%{background: linear-gradient(360deg,red,blue); }
        }
        /*animation: 動畫名稱 播放一次的時間(s/ms)
        */
        #d1{
            background: linear-gradient(90deg,red,blue);
            animation: kd1 0.5s infinite linear;
        }
        @keyframes kd2 {
            0%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            15%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            29%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            43%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            57%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            71%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            86%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
            100%{background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet); }
        }
        #d2{
            height: 50px;
            background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet);
            animation: kd2 0.5s infinite linear;

        }
        #d3{
            background: linear-gradient(90deg,red 30%,white 30%,white 70%,blue 70%);
        }
        @keyframes kd4 {
            0%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            15%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            29%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            43%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            57%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            71%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            86%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
            100%{background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%); }
        }
        #d4{
            height: 50px;
            background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%);
        }
        /*radial-gradient輻射漸層
        預設會隨容器的寬高變形(橢圓形)，圓心到最遠點
        第一個參數加上circle，強制用圓形
        */
        #r1{
            height: 200px;
            background:  radial-gradient(circle,yellow,white 50%,black 70%);
        }
        #r2{
            height: 200px;
            background: repeating-radial-gradient(circle,green 20%,yellow 30%,green 40%);
        }
        /* conic-gradient 圓形漸層:
           預設由上方(0deg)，順時針繞園心一周
           第一個參數可以修改起點位置 from 0~360deg
        */
        #c1{
            height: 200px;
            background: conic-gradient(red,yellow,blue);
        }
        #c2{
            height: 200px;
            background: repeating-conic-gradient(red 10%,blue 15%,red 20%);
        }
    </style>
    <body>
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>

        <div id="r1"></div>
        <div id="r2"></div>

        <div id="c1"></div>
        <div id="c2"></div>

    </body>
</head>    
</html>
