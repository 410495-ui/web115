<html>
<head>
    <title>0323-CSS漸層</title>
    <style>
        div{
            margin-bottom: 10px;
            width: 400px;
            height: 100px;
        }
        #d1{
            /*linear-gradient 線性漸層: 
            第一個參數放漸層方向，有兩種寫法:
            1.to 方向:top/right/bottom/left
            2.0~360deg:順時鐘方向
            */
            background: linear-gradient(135deg,red,yellow)
        }
        #d2{
            height: 50px;
            background: linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet);
        }
        #d3{
            background: linear-gradient(90deg,red 30%,white 30%,white 70%,blue 70%);
        }
        #d4{
            height: 50px;
            background: repeating-linear-gradient(45deg,red 30%,white 35%,yellow 40%,white 45%,red 50%);
        }
        /*radial-gradient輻射漸層
        預設會隨容器的寬高變形(橢圓形)，圓心到最遠點
        第一個參數加上circle，強制用圓形
        */
        #r1{
            height: 200px;
            background:  radial-gradient(circle,yellow,white 50%,black 70%);
        }
        #r2{
            height: 200px;
            background: repeating-radial-gradient(circle,green 20%,yellow 30%,green 40%);
        }
        /* conic-gradient 圓形漸層:
           預設由上方(0deg)，順時針繞園心一周
           第一個參數可以修改起點位置 from 0~360deg
        */
        #c1{
            height: 200px;
            background: conic-gradient(red,yellow,blue);
        }
        #c2{
            height: 200px;
            background: repeating-conic-gradient(red 10%,blue 15%,red 20%);
        }
    </style>
    <body>
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>

        <div id="r1"></div>
        <div id="r2"></div>

        <div id="c1"></div>
        <div id="c2"></div>

    </body>
</head>    
</html>
